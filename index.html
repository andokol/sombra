<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sombra's Night Arcade</title>
<meta name="description" content="A gamified Spanish course for English-speaking beginners, hosted by a black kitten named Sombra.">
<meta name="theme-color" content="#09041A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sombra">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#09041A; --bg2:#150A32;
  --panel:rgba(56,35,104,.72); --panel2:rgba(70,45,126,.8);
  --glass:rgba(255,255,255,.08); --glass2:rgba(255,255,255,.14);
  --edge:rgba(255,255,255,.2); --edge2:rgba(255,255,255,.34);
  --ink:#F4EFFF; --ink2:#DCD2F7; --muted:#A294CE;
  --lime:#4FEE9B; --limeDark:#1E9A5E;
  --pink:#FF4D8D; --pinkDark:#B32659;
  --gold:#FFC93C; --goldDark:#B78400;
  --cyan:#47E0FF; --cyanDark:#1A8FA8;
  --violet:#B07BFF; --violetDark:#6C3BB8;
  --orange:#FF8A3D; --orangeDark:#B85512;
  --bad:#FF5C5C; --badDark:#A32B2B;
  --fur:#120C24; --fur2:#241941; --furl:#41306B; --eye:#FFC93C; --snow:#F8F4FF;
  --r:20px; --rs:14px;
  --fd:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --fb:"Nunito","Segoe UI",system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--fb); font-size:16px; font-weight:700; line-height:1.45;
  -webkit-text-size-adjust:100%; overflow-x:hidden;
}
body:before{
  content:""; position:fixed; inset:-25%; z-index:-3; pointer-events:none;
  background:
    radial-gradient(36% 30% at 20% 16%, rgba(176,123,255,.34), transparent 62%),
    radial-gradient(32% 28% at 84% 24%, rgba(71,224,255,.24), transparent 62%),
    radial-gradient(38% 32% at 48% 92%, rgba(255,77,141,.22), transparent 64%),
    radial-gradient(60% 60% at 50% 40%, rgba(21,10,50,.9), var(--bg) 75%);
  filter:blur(26px); animation:drift 26s ease-in-out infinite alternate;
}
@keyframes drift{
  0%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(2%,-2%,0) scale(1.06)}
  100%{transform:translate3d(-2%,2%,0) scale(1.03)}
}
#stars{position:fixed; inset:0; z-index:-2; pointer-events:none}
*{box-sizing:border-box}
button{font:inherit; color:inherit; -webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--cyan); outline-offset:3px}
h1,h2,h3{font-family:var(--fd); margin:0; font-weight:600; text-wrap:balance}

/* ---------------- shell ---------------- */
#app{max-width:540px; margin:0 auto; min-height:100%; display:flex; flex-direction:column}
#bar{
  position:sticky; top:0; z-index:30;
  padding:10px 16px; display:flex; align-items:center; gap:7px;
  background:linear-gradient(to bottom, rgba(9,4,26,.94), rgba(9,4,26,.62) 70%, transparent);
  backdrop-filter:blur(12px);
}
main{flex:1; padding:0 16px 130px}
.screen[hidden]{display:none!important}

.chip{
  display:inline-flex; align-items:center; gap:5px; font-family:var(--fd); font-weight:600; font-size:14px;
  background:var(--panel); border:1px solid var(--edge2); border-radius:999px; padding:6px 12px; white-space:nowrap;
  transition:transform .2s var(--spring);
}
.chip b{font-variant-numeric:tabular-nums}
.ic{display:block; flex:0 0 auto}
.icrow{display:inline-flex; align-items:center; gap:7px}
.chip .ic,.btn .ic,.row .ic{display:inline-block; vertical-align:-3px}
.chip.pop{animation:chippop .45s var(--spring)}
@keyframes chippop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
.chip.gold{color:var(--gold); box-shadow:0 0 16px rgba(255,201,60,.22) inset}
.chip.pink{color:var(--pink); box-shadow:0 0 16px rgba(255,77,141,.22) inset}
.chip.cyan{color:var(--cyan); box-shadow:0 0 16px rgba(71,224,255,.22) inset}
.spacer{flex:1}
.ring{width:40px; height:40px; flex:0 0 40px; position:relative}
.ring svg{display:block; transform:rotate(-90deg)}
.ring span{position:absolute; inset:0; display:grid; place-items:center; font-size:11px; font-weight:800; font-family:var(--fd)}

/* ---------------- buttons ---------------- */
.btn{
  position:relative; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-family:var(--fd); font-weight:600; font-size:17px; letter-spacing:.3px;
  padding:14px 22px; border-radius:var(--r); border:0; cursor:pointer;
  background:linear-gradient(180deg,var(--panel2),var(--panel)); color:var(--ink);
  box-shadow:0 5px 0 rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.16);
  transition:transform .1s var(--spring), box-shadow .1s, filter .2s;
  overflow:hidden;
}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.16)}
.btn.go{background:linear-gradient(180deg,#63FFAB,var(--lime)); color:#052A18; box-shadow:0 5px 0 var(--limeDark), 0 0 26px rgba(79,238,155,.42)}
.btn.gold{background:linear-gradient(180deg,#FFD866,var(--gold)); color:#2B1C00; box-shadow:0 5px 0 var(--goldDark), 0 0 26px rgba(255,201,60,.40)}
.btn.pink{background:linear-gradient(180deg,#FF6FA3,var(--pink)); color:#33061A; box-shadow:0 5px 0 var(--pinkDark), 0 0 26px rgba(255,77,141,.38)}
.btn.bad{background:linear-gradient(180deg,#FF7C7C,var(--bad)); color:#2E0505; box-shadow:0 5px 0 var(--badDark)}
.btn.ghost{background:transparent; border:2px solid var(--edge2); box-shadow:none; color:var(--muted)}
.btn.ghost:active{transform:translateY(2px)}
.btn[disabled]{opacity:.35; box-shadow:none; transform:none; cursor:default}
.btn.wide{width:100%}
.btn.sm{font-size:14px; padding:10px 15px; border-radius:var(--rs); box-shadow:0 4px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.14)}
.btn.sm:active{transform:translateY(3px)}
.iconbtn{
  background:var(--panel); border:1px solid var(--edge2); border-radius:50%; width:40px; height:40px;
  display:grid; place-items:center; cursor:pointer; font-size:17px; line-height:1; flex:0 0 40px;
  transition:transform .12s var(--spring);
}
.iconbtn:active{transform:scale(.88)}

/* ---------------- kitten ---------------- */
.catwrap{position:relative; width:120px; flex:0 0 120px; animation:breathe 3.4s ease-in-out infinite}
.catwrap.lg{width:178px; flex-basis:178px}
.catwrap.sm{width:78px; flex-basis:78px}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-4px) scale(1.018)}}
.cat{width:100%; height:auto; display:block; overflow:visible; filter:drop-shadow(0 8px 18px rgba(0,0,0,.55))}
.cat .fur{fill:var(--fur)} .cat .fur2{fill:var(--fur2)} .cat .furl{fill:var(--furl)}
.cat .snow{fill:var(--snow)} .cat .inner{fill:#5B4779}
.cat .sclera{fill:var(--eye); filter:drop-shadow(0 0 5px rgba(255,201,60,.65))}
.cat .pupil{fill:#0B0718} .cat .glint{fill:#fff}
.cat .nose{fill:#3B2D4D}
.cat .line{stroke:var(--furl); stroke-width:2.4; stroke-linecap:round; fill:none}
.cat .wh{stroke:#fff; stroke-width:2; stroke-linecap:round; opacity:.8; fill:none}
.cat .blush{fill:var(--pink); opacity:.34}
.cat .mouth{display:none; stroke:var(--furl); stroke-width:2.4; stroke-linecap:round; fill:none}
.cat[data-mood="idle"] .m-idle{display:block}
.cat[data-mood="happy"] .m-happy{display:block}
.cat[data-mood="sad"] .m-sad{display:block}
.cat[data-mood="wow"] .m-wow{display:block; fill:#0B0718; stroke:none}
.cat[data-mood="sleepy"] .m-idle{display:block}
.cat .tail{transform-origin:84px 94px; animation:tail 3s ease-in-out infinite alternate}
.cat .eyes{animation:blinkeyes 6.5s infinite}
.cat .lid{opacity:0; animation:blinklid 6.5s infinite}
.cat[data-mood="sad"] .eyes{transform:translateY(3px)}
.cat[data-mood="sleepy"] .eyes{opacity:0}
.cat[data-mood="sleepy"] .lid{opacity:1; animation:none}
.cat[data-mood="wow"] .sclera{transform:scale(1.1); transform-origin:center}
@keyframes tail{from{transform:rotate(-10deg)} to{transform:rotate(12deg)}}
@keyframes blinkeyes{0%,94%,100%{opacity:1} 96%,98%{opacity:0}}
@keyframes blinklid{0%,94%,100%{opacity:0} 96%,98%{opacity:1}}
.hat{position:absolute; left:50%; top:-2%; transform:translateX(-50%) rotate(-14deg); pointer-events:none; line-height:1}
.wiggle{animation:wig 1s ease}
@keyframes wig{0%,100%{transform:rotate(0) translateY(0)}18%{transform:rotate(-7deg) translateY(-5px)}44%{transform:rotate(6deg)}68%{transform:rotate(-3deg)}}
.jump{animation:jump .62s var(--spring)}
@keyframes jump{
  0%{transform:translateY(0) scale(1,1)}
  18%{transform:translateY(0) scale(1.16,.84)}
  45%{transform:translateY(-26px) scale(.9,1.14) rotate(-7deg)}
  70%{transform:translateY(0) scale(1.1,.9)}
  100%{transform:translateY(0) scale(1,1)}
}
.bonk{animation:bonk .75s}
@keyframes bonk{0%{transform:translateY(0) scale(1,1)}14%{transform:translateY(7px) scale(1.16,.84)}
 34%{transform:translateY(0) rotate(-8deg)}54%{transform:rotate(7deg)}74%{transform:rotate(-4deg)}100%{transform:none}}
.slump{animation:slump .7s ease}
@keyframes slump{0%{transform:translateY(0)}35%{transform:translateY(7px) rotate(3deg) scale(1.05,.94)}100%{transform:translateY(0)}}
.spin{animation:spin 1s var(--spring)}
@keyframes spin{0%{transform:rotate(0) scale(1)}55%{transform:rotate(380deg) scale(1.22)}100%{transform:rotate(360deg) scale(1)}}

/* ---------------- speech bubble ---------------- */
.bubble{
  position:relative; flex:1; padding:13px 16px; border-radius:18px; font-size:15px; color:var(--ink2);
  background:var(--panel); border:1px solid var(--edge2); backdrop-filter:blur(8px);
}
.bubble:before,.bubble:after{content:""; position:absolute; left:-9px; top:22px; border:8px solid transparent; border-right-color:var(--edge)}
.bubble:after{left:-7px; border-right-color:var(--panel)}
.bubble b{color:var(--gold)}

/* ---------------- home ---------------- */
.hero{display:flex; gap:12px; align-items:flex-start; padding:12px 0 4px}
.card{
  background:var(--panel); border:1px solid var(--edge); border-radius:var(--r); padding:16px;
  backdrop-filter:blur(10px); margin-bottom:12px;
}
.quickrow{display:flex; gap:8px; flex-wrap:wrap; padding:12px 0 2px}
.lvlcard{display:flex; align-items:center; gap:13px}
.xpbar{height:13px; border-radius:999px; background:rgba(0,0,0,.45); overflow:hidden; position:relative; border:1px solid var(--edge)}
.xpbar i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--cyan),var(--lime)); transition:width .6s var(--spring); position:relative}
.xpbar i:after{content:""; position:absolute; inset:0; background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%); animation:sheen 2.6s linear infinite}
@keyframes sheen{from{transform:translateX(-100%)} to{transform:translateX(220%)}}

.world{margin:26px 0 6px; position:relative}
.worldhead{
  display:flex; gap:13px; align-items:center; padding:14px 16px; border-radius:var(--r);
  background:linear-gradient(120deg, color-mix(in srgb, var(--uc) 26%, transparent), var(--glass) 70%);
  border:1px solid var(--edge); position:relative; overflow:hidden;
}
.worldhead:before{
  content:""; position:absolute; inset:0; opacity:.5;
  background:radial-gradient(60% 120% at 6% 50%, color-mix(in srgb,var(--uc) 40%, transparent), transparent 70%);
}
.worldhead>*{position:relative}
.worldhead .badge{
  width:52px; height:52px; flex:0 0 52px; border-radius:16px; display:grid; place-items:center; font-size:27px;
  background:rgba(0,0,0,.35); border:1px solid var(--edge2); box-shadow:0 0 22px color-mix(in srgb,var(--uc) 45%, transparent);
}
.worldhead .num{font-family:var(--fd); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--uc); font-weight:600}
.worldhead h2{font-size:20px; line-height:1.15}
.worldhead p{margin:2px 0 0; font-size:13px; color:var(--muted)}
.crowns{font-family:var(--fd); font-size:14px; color:var(--gold); white-space:nowrap; display:flex; align-items:center; gap:5px}
.node .cr{display:flex; gap:1px; color:var(--gold); align-items:center}

.path{position:relative; padding:14px 0 6px}
.noderow{display:flex; align-items:center; justify-content:center; min-height:74px; position:relative}
.node{
  width:66px; height:66px; border-radius:50%; border:0; cursor:pointer; position:relative;
  display:grid; place-items:center; font-family:var(--fd); font-size:23px; font-weight:600;
  background:rgba(255,255,255,.07); color:var(--muted);
  box-shadow:0 6px 0 rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.14);
  transition:transform .12s var(--spring);
}
.node:active{transform:translateY(4px) scale(.96)}
.node.done{background:linear-gradient(180deg,#63FFAB,var(--lime)); color:#052A18; box-shadow:0 6px 0 var(--limeDark), 0 0 24px rgba(79,238,155,.4)}
.node.open{background:linear-gradient(180deg,#FFD866,var(--gold)); color:#2B1C00; box-shadow:0 6px 0 var(--goldDark), 0 0 30px rgba(255,201,60,.55)}
.node.locked{cursor:not-allowed; opacity:.4; font-size:19px}
.node.boss{width:82px; height:82px; font-size:30px}
.node.open:after{
  content:""; position:absolute; inset:-9px; border-radius:50%; border:3px solid var(--gold); opacity:.5;
  animation:ping 1.8s ease-out infinite;
}
@keyframes ping{0%{transform:scale(.9); opacity:.6} 70%{transform:scale(1.22); opacity:0} 100%{opacity:0}}
.node .cr{
  position:absolute; bottom:-9px; left:50%; transform:translateX(-50%); font-size:10px; letter-spacing:-1px;
  background:rgba(9,4,26,.95); border:1px solid var(--edge); border-radius:999px; padding:2px 7px;
}
.nodelabel{position:absolute; left:calc(50% + 52px); font-family:var(--fd); font-size:12px; color:var(--muted); width:84px; text-align:left}
.walker{position:absolute; width:58px; flex-basis:58px; left:50%; margin-left:-104px; top:4px; pointer-events:none; animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)}}

/* ---------------- lesson ---------------- */
.pbar{height:16px; border-radius:999px; background:rgba(0,0,0,.5); border:1px solid var(--edge); overflow:hidden; flex:1; position:relative}
.pbar i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--lime),var(--cyan)); transition:width .45s var(--spring); position:relative}
.pbar i:after{content:""; position:absolute; inset:0; background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%); animation:sheen 2.2s linear infinite}
.hearts{display:flex; gap:3px; color:var(--pink)}
.hearts .ic{filter:drop-shadow(0 0 6px rgba(255,77,141,.5))}
.heart{transition:transform .3s var(--spring), filter .3s, opacity .3s}
.heart.gone{color:var(--muted); opacity:.3; transform:scale(.82)}
.heart.gone .ic{filter:none}
.heart.breaking{animation:heartbreak .55s ease forwards}
@keyframes heartbreak{0%{transform:scale(1.5)}40%{transform:scale(.7) rotate(-16deg)}100%{transform:scale(.8); filter:grayscale(1) brightness(.5); opacity:.35}}

.qcard{animation:qin .42s var(--spring)}
@keyframes qin{from{opacity:0; transform:translateY(26px) scale(.97)} to{opacity:1; transform:none}}
.qhead{display:flex; gap:12px; align-items:flex-start; padding:16px 0 14px}
.qtag{
  display:inline-block; font-family:var(--fd); font-size:11px; letter-spacing:1.4px; text-transform:uppercase;
  color:var(--cyan); background:rgba(71,224,255,.12); border:1px solid rgba(71,224,255,.3);
  border-radius:999px; padding:3px 10px; margin-bottom:7px;
}
.qtext{font-family:var(--fd); font-size:22px; font-weight:600; line-height:1.3}
.es{color:var(--gold); font-family:var(--fd); font-weight:600; text-shadow:0 0 14px rgba(255,201,60,.4)}

.opts{display:flex; flex-direction:column; gap:11px}
.opts.grid{display:grid; grid-template-columns:1fr 1fr; gap:11px}
.opt{
  position:relative; text-align:left; cursor:pointer; font-weight:800; font-size:17px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:2px solid var(--edge2); border-radius:var(--r); padding:15px 16px;
  display:flex; align-items:center; gap:11px; overflow:hidden;
  box-shadow:0 4px 0 rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.14);
  transition:transform .12s var(--spring), border-color .18s, background .18s, box-shadow .18s;
}
.opt:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.4)}
.opt .k{
  font-size:12px; font-weight:800; color:var(--muted); border:1px solid var(--edge);
  border-radius:7px; width:22px; height:22px; display:grid; place-items:center; flex:0 0 22px;
}
.opt.sel{border-color:var(--cyan); background:rgba(71,224,255,.15); box-shadow:0 4px 0 var(--cyanDark), 0 0 22px rgba(71,224,255,.3)}
.opt.ok{border-color:var(--lime); background:rgba(79,238,155,.2); box-shadow:0 4px 0 var(--limeDark), 0 0 28px rgba(79,238,155,.45); animation:okpulse .5s var(--spring)}
@keyframes okpulse{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
.opt.no{border-color:var(--bad); background:rgba(255,92,92,.16); box-shadow:0 4px 0 var(--badDark); animation:nowobble .45s}
@keyframes nowobble{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.opt.dim{opacity:.28}
.opt.big{justify-content:center; font-size:46px; padding:22px 0; aspect-ratio:1.22}
.opt.tf{justify-content:center; gap:9px; font-size:19px; padding:22px 0; font-family:var(--fd)}
.opt.tf:first-child{color:var(--lime)} .opt.tf:last-child{color:var(--pink)}
.opt.tf span{color:var(--ink)}

.speakbig{
  width:100%; padding:30px; border-radius:var(--r); border:2px solid var(--edge); cursor:pointer;
  background:radial-gradient(70% 90% at 50% 20%, rgba(71,224,255,.26), var(--panel)); color:var(--ink);
  display:grid; place-items:center; gap:7px; font-size:48px; box-shadow:0 5px 0 rgba(0,0,0,.4);
}
.speakbig small{font-family:var(--fd); font-size:13px; color:var(--cyan); letter-spacing:1px}
.speakbig:active{transform:translateY(3px)}
.wave{display:flex; gap:4px; height:20px; align-items:flex-end; justify-content:center; margin-top:2px}
.wave i{width:4px; background:var(--cyan); border-radius:2px; height:6px; animation:eq .85s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s} .wave i:nth-child(3){animation-delay:.2s}
.wave i:nth-child(4){animation-delay:.3s} .wave i:nth-child(5){animation-delay:.4s}
@keyframes eq{0%,100%{height:5px; opacity:.5} 50%{height:19px; opacity:1}}

.blankline{
  font-family:var(--fd); font-size:23px; text-align:center; padding:24px 14px; line-height:1.55;
  background:var(--panel); border:2px dashed var(--edge2); border-radius:var(--r);
}
.blankline u{display:inline-block; min-width:96px; border-bottom:3px solid var(--gold); text-decoration:none; color:var(--gold)}
.hintline{text-align:center; color:var(--muted); font-size:14px; margin-top:10px}
.slot{
  min-height:64px; border-top:2px dashed var(--edge2); border-bottom:2px dashed var(--edge2);
  display:flex; flex-wrap:wrap; gap:8px; align-content:center; padding:12px 8px; margin-bottom:18px;
}
.bank{display:flex; flex-wrap:wrap; gap:9px; justify-content:center}
.tile{
  background:linear-gradient(180deg,var(--panel2),var(--panel)); border:2px solid var(--edge2); border-radius:var(--rs); cursor:pointer;
  padding:10px 14px; font-weight:800; font-size:17px; font-family:var(--fd);
  box-shadow:0 4px 0 rgba(0,0,0,.42); transition:transform .1s var(--spring);
  animation:tilein .3s var(--spring) backwards; position:relative; overflow:hidden;
}
@keyframes tilein{from{opacity:0; transform:scale(.6)} to{opacity:1; transform:none}}
.tile:active{transform:translateY(3px)}
.tile.used{visibility:hidden}
.tile.letter{min-width:46px; text-align:center; font-size:21px; text-transform:lowercase}

.typewrap input{
  width:100%; font-family:var(--fd); font-size:22px; padding:16px; border-radius:var(--r);
  border:2px solid var(--edge2); background:var(--panel); color:var(--ink);
  box-shadow:0 4px 0 rgba(0,0,0,.5);
}

function rollBox(perfect,boss){
  var r=Math.random();
  if(boss&&perfect)return r<.55?'mega':'gold';
  if(boss)return r<.2?'mega':(r<.7?'gold':'silver');
  if(perfect)return r<.12?'mega':(r<.62?'gold':'silver');
  return r<.04?'mega':(r<.26?'gold':(r<.66?'silver':'wood'));
}
function unownedHats(){ return HATS.filter(function(h){ return S.hats.indexOf(h.id)<0 }) }
function rollRewards(key){
  var b=BOXES[key], out=[], n=b.rolls;
  var mult={wood:1,silver:1.7,gold:2.8,mega:4.5}[key];
  var hatChance={wood:0,silver:.06,gold:.18,mega:.45}[key];
  var free=unownedHats();
  if(free.length&&Math.random()<hatChance){
    out.push({k:'hat',id:free[Math.floor(Math.random()*free.length)].id});
    n--;
  }
  for(var i=0;i<n;i++){
    var r=Math.random();
    if(r<.55)out.push({k:'fish',n:Math.max(3,Math.round((6+Math.random()*10)*mult))});
    else if(r<.8)out.push({k:'xp',n:Math.max(10,Math.round((10+Math.random()*14)*mult))});
    else if(r<.92)out.push({k:'hint',n:1});
    else out.push({k:'freeze',n:1});
  }
  var merged=[];
  out.forEach(function(x){
    var hit=merged.filter(function(m){ return m.k===x.k&&x.k!=='hat' })[0];
    if(hit)hit.n+=x.n; else merged.push(x);
  });
  return merged;
}
function rewardLabel(r){
  if(r.k==='fish')return {ico:'fish',col:'var(--cyan)',t:'+'+r.n+' fish'};
  if(r.k==='xp')return {ico:'bolt',col:'var(--gold)',t:'+'+r.n+' XP'};
  if(r.k==='hint')return {ico:'bulb',col:'var(--gold)',t:'+'+r.n+' hint'+(r.n>1?'s':'')};
  if(r.k==='freeze')return {ico:'snow',col:'var(--cyan)',t:'+'+r.n+' streak freeze'+(r.n>1?'s':'')};
  var h=HATS.filter(function(x){return x.id===r.id})[0];
  return {hat:h,col:'var(--pink)',t:h?h.t+' \u2014 new hat!':'New hat!'};
}
function applyReward(r){
  if(r.k==='fish')S.fish+=r.n;
  else if(r.k==='xp'){ S.xp+=r.n; S.dxp+=r.n }
  else if(r.k==='hint')S.items.hint=(S.items.hint||0)+r.n;
  else if(r.k==='freeze')S.items.freeze=(S.items.freeze||0)+r.n;
  else if(r.k==='hat'){ if(S.hats.indexOf(r.id)<0)S.hats.push(r.id); S.hat=r.id }
}
function roadNext(){ return S.road<ROAD.length?ROAD[S.road]:null }
function checkRoad(){
  var won=[];
  while(S.road<ROAD.length && S.xp>=ROAD[S.road].xp){ won.push(ROAD[S.road].r); S.road++ }
  won.forEach(applyReward);
  return won;
}

(function starfield(){
  var cv=$('#stars'); if(!cv)return;
  var ctx=cv.getContext('2d'), parts=[], raf=null, w=0, h=0;
  function size(){
    var d=Math.min(2,window.devicePixelRatio||1);
    w=cv.clientWidth; h=cv.clientHeight;
    cv.width=Math.max(1,w*d); cv.height=Math.max(1,h*d); ctx.setTransform(d,0,0,d,0,0);
  }
  function seed(){
    parts=[];
    var n=Math.round(Math.min(70,Math.max(18,(w*h)/13000)));
    for(var i=0;i<n;i++)parts.push({x:Math.random()*w, y:Math.random()*h, r:.6+Math.random()*1.9,
      s:.06+Math.random()*.22, a:.2+Math.random()*.55, t:Math.random()*6.28});
  }
  function draw(anim){
    ctx.clearRect(0,0,w,h);
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      if(anim){ p.y-=p.s; p.t+=.016; if(p.y<-4){ p.y=h+4; p.x=Math.random()*w } }
      var tw=p.a*(anim?(0.62+0.38*Math.sin(p.t*1.7)):1);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283);
      ctx.fillStyle='rgba(215,200,255,'+tw.toFixed(3)+')'; ctx.fill();
    }
  }
  function frame(){ draw(true); raf=requestAnimationFrame(frame) }
  function startA(){ if(!raf&&!reduced)raf=requestAnimationFrame(frame) }
  function stopA(){ if(raf){cancelAnimationFrame(raf); raf=null} }
  window.addEventListener('resize',function(){ size(); seed(); if(reduced)draw(false) });
  document.addEventListener('visibilitychange',function(){ document.visibilityState==='hidden'?stopA():startA() });
  size(); seed();
  if(reduced)draw(false); else startA();
})();

var voiceOK=false, esVoice=null;
function pickVoice(){
  try{
    var vs=window.speechSynthesis?window.speechSynthesis.getVoices():[];
    if(!vs||!vs.length)return;
    var order=['es-ES','es-MX','es-US','es-AR','es-CO','es'];
    for(var i=0;i<order.length;i++)for(var j=0;j<vs.length;j++){
      var lang=(vs[j].lang||'').replace('_','-');
      if(lang.toLowerCase().indexOf(order[i].toLowerCase())===0){esVoice=vs[j]; voiceOK=true; return}
    }
  }catch(e){}
}

function say(text,rate){
  if(!S.settings.sound||!window.speechSynthesis||!text)return;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(String(text).replace(/_/g,' '));
    u.lang=esVoice?esVoice.lang:'es-ES'; if(esVoice)u.voice=esVoice;
    u.rate=rate||S.settings.speed; u.pitch=1.06;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function addSay(qs){
  if(!voiceOK||!qs.length)return qs;
  var long=qs.filter(function(x){ return x.es&&x.en&&String(x.es).split(' ').length>=3 });
  var any=qs.filter(function(x){ return x.es&&x.en });
  var pick=(long.length?long:any)[0];
  if(!pick)return qs;
  return qs.concat([{t:'say',es:pick.es,en:pick.en,u:pick.u,topic:pick.topic,d:pick.d}]);
}
function dedupeWords(list){
  var seen={}, out=[];
  for(var i=0;i<list.length;i++){
    var q=list[i];
    var k=norm(q.es||q.a||(q.pairs&&q.pairs.length?q.pairs[0][0]:'')||('#'+i));
    if(seen[k])continue;
    seen[k]=1; out.push(q);
  }
  return out;
}
function spread(list){
  var out=[],pool=list.slice(),last='';
  while(pool.length){
    var k=0; while(k<pool.length && pool[k].t===last && pool.length>1) k++;
    if(k>=pool.length)k=0;
    last=pool[k].t; out.push(pool.splice(k,1)[0]);
  }
  return out;
}
function lessonQs(u,l){
  var pool=(byUnit[u]||[]).filter(usable);
  if(!pool.length)return [];
  var sorted=pool.slice().sort(function(a,b){return (a.d||2)-(b.d||2) || a._i-b._i});
  if(l>LPU) return addSay(dedupeWords(shuffle(sorted)).slice(0,BOSSQ));
  var per=Math.max(QPL,Math.floor(sorted.length/LPU));
  var start=Math.min((l-1)*per, Math.max(0,sorted.length-QPL));
  var chunk=dedupeWords(sorted.slice(start,start+per));
  if(chunk.length<QPL) chunk=dedupeWords(chunk.concat(sorted));
  return addSay(spread(sshuffle(chunk,u*211+l*17)).slice(0,QPL));
}

function tileBuilder(box,tiles,letter){
  var slot=el('div','slot'), bank=el('div','bank'), chosen=[];
  box.appendChild(slot); box.appendChild(bank);
  var nodes=tiles.map(function(w,i){
    var b=el('button','tile'+(letter?' letter':''),w); b.type='button';
    b.style.animationDelay=(i*.04)+'s';
    b.onclick=function(){ if(b.classList.contains('used'))return; SFX.pick(); haptic(6);
      b.classList.add('used'); chosen.push({w:w,node:b}); paint() };
    bank.appendChild(b); return b;
  });
  function paint(){
    slot.innerHTML='';
    chosen.forEach(function(c,idx){
      var b=el('button','tile'+(letter?' letter':''),c.w); b.type='button';
      b.onclick=function(){ SFX.tap(); c.node.classList.remove('used'); chosen.splice(idx,1); paint() };
      slot.appendChild(b);
    });
    footer();
  }
  return {value:function(){return chosen.map(function(c){return c.w})},
    slot:function(){return slot},
    lock:function(){ slot.querySelectorAll('button').forEach(function(b){b.onclick=null}); nodes.forEach(function(b){b.onclick=null}) },
    setAll:function(arr){ chosen=[]; nodes.forEach(function(b){b.classList.remove('used')});
      arr.forEach(function(w){ for(var i=0;i<nodes.length;i++){ if(nodes[i].textContent===w&&!nodes[i].classList.contains('used')){
        nodes[i].classList.add('used'); chosen.push({w:w,node:nodes[i]}); break } } }); paint() }};
}

RENDER.pairs=function(q,box){

  var g=el('div','pairgrid'); box.appendChild(g);
  var lcol=el('div','list'), rcol=el('div','list'); g.appendChild(lcol); g.appendChild(rcol);
  var pick=null, matched=0, misses=0, done=false;
  function mk(o,side,col){
    var b=el('button','opt'); b.type='button'; b.textContent=o.v;
    b.onclick=function(){
      if(b.classList.contains('matched')||done)return;
      if(pick&&pick.side===side){ pick.node.classList.remove('sel'); pick=null }
      if(!pick){ pick={node:b,o:o,side:side}; b.classList.add('sel'); SFX.pick(); if(side==='l')say(o.v); return }
      b.classList.add('sel');
      if(pick.o.i===o.i){
        var a=pick.node;

        a.classList.remove('sel'); b.classList.remove('sel');
        SFX.coin(); haptic(10); burstAt(b,['#4FEE9B','#47E0FF'],10);

    check:function(){return true}, reveal:function(){}, hint:function(){return false},

var HYPE=["On fire!","Unstoppable!","Sombra is impressed","Combo master","You are cooking"];
function doCheck(){
  if(!cur||!cur.ready())return;
  var item=L.q[L.i], q=item.q;
  var ok=cur.check();
  if(q.t==='pairs'&&cur.misses&&cur.misses()>0)ok=true;
  var clean=(q.t!=='pairs')||(cur.misses&&cur.misses()===0);
  cur.reveal();
  L.done++;
  var s=$('#s-lesson');
  var fb=el('div','fb '+(ok?'ok':'no'));
  if(ok){
    L.ok++;
    if(clean){ L.combo++; if(L.combo>L.bcombo)L.bcombo=L.combo }
    var gain=(L.practice?5:10)+Math.min(5,Math.floor(L.combo/3));
    L.xp+=gain; S.xp+=gain; S.dxp+=gain; S.corr++;
    if(q.t==='listen')S.heard++;
    if(q.t==='type')S.typed++;
    if(q.t==='say')S.said=(S.said||0)+1;
    learn(q,true); dropMiss(q);
    var node=cur.okNode?cur.okNode():null;
    burstAt(node,['#4FEE9B','#FFC93C','#47E0FF','#B07BFF'],L.combo>=5?26:16);
    shockwave(node,L.combo>=5?'#FFC93C':'#4FEE9B');
    if(L.combo===5||L.combo===10||L.combo===20)screenFlash('#FFC93C');
    flyXP(node,gain);
    SFX.right(L.combo); haptic(12); bumpXP();
    fb.appendChild(el('h3',null,L.combo>=5?HYPE[L.combo%HYPE.length]:PRAISE[Math.floor(Math.random()*PRAISE.length)]));
    var p=el('p'); p.innerHTML=answerLine(q)+' <span class="gain">+'+gain+' XP'+(L.combo>=3?' · x'+L.combo:'')+'</span>';
    fb.appendChild(p);
    setMood($('#s-lesson'),L.combo>=5?'wow':'happy','jump');
    phase='ok';
  } else {
    L.bad++; L.combo=0; S.wrong++;
    if(!L.practice){
      var hs=document.querySelectorAll('#bar .heart');
      if(hs[L.hearts-1])hs[L.hearts-1].classList.add('breaking');
      L.hearts--;
    }
    learn(q,false); addMiss(q);
    if(!item.retry&&L.retries<2){ L.q.push({q:q,retry:true}); L.total++; L.retries++ }
    SFX.wrong(); haptic([18,40,18]); screenShake();
    fb.appendChild(el('h3',null,'Not quite — look again'));
    var p2=el('p'); p2.innerHTML=answerLine(q,true); fb.appendChild(p2);
    setMood($('#s-lesson'),'sad');
    bonkCat($('#s-lesson'));
    phase='no';
  }
  s.appendChild(fb);
  if(q.es)say(q.es);
  var keepHearts=L.hearts;
  drawBar();
  if(!ok&&!L.practice){
    var hs2=document.querySelectorAll('#bar .heart');
    if(hs2[keepHearts])hs2[keepHearts].classList.add('breaking');
  }
  footer(); save(); checkLevelUp();
  if(!L.practice&&L.hearts<=0)setTimeout(function(){ if(L&&L.hearts<=0)outOfHearts() },750);
  fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function finish(){
  var acc=(L.ok+L.bad)?L.ok/(L.ok+L.bad):1;
  var perfect=(L.bad===0);
  var bonus=L.practice?10:(20+(perfect?50:0)+(L.boss?40:0));
  L.xp+=bonus; S.xp+=bonus; S.dxp+=bonus;
  var fish=L.practice?2:(5+(perfect?5:0)+(L.boss?10:0));
  S.fish+=fish; S.plays++;
  if(L.boss)S.bosses=(S.bosses||0)+1;
  if(L.bcombo>S.bcombo)S.bcombo=L.bcombo;
  var gained=0;
  if(!L.practice){
    var key=lk(L.u,L.l), rec=S.lessons[key]||(S.lessons[key]={c:0,best:0,p:0});
    rec.p=(rec.p||0)+1;
    var want=perfect?2:1;
    if(want>rec.c){ gained=want-rec.c; rec.c=want }
    if(acc>(rec.best||0))rec.best=acc;
  }
  var prevStreak=S.streak;
  bumpStreak(); flush();
  var streakUp=(S.streak>prevStreak)?S.streak:0;
  var newB=checkBadges({perfect:perfect,boss:L.boss,combo:L.bcombo});
  flush();

  var wasBoss=L.boss, wasPractice=L.practice, wu=L.u, wl=L.l, lx=L.xp, lcmb=L.bcombo;
  var s=$('#s-done'); s.innerHTML='';
  var c=el('div','center'); c.appendChild(cat('lg',perfect?'wow':'happy'));
  c.appendChild(el('h2',null,perfect?'¡Perfecto! Flawless':(wasPractice?'Repaso done':'Lesson clear!')));
  var sub=el('p',null,wasBoss?'You beat Sombra’s Challenge for unit '+wu+'.':(wasPractice?'Your weakest words got a workout.':'Unit '+wu+', lesson '+wl+'.'));
  sub.style.cssText='color:var(--muted);margin-top:6px'; c.appendChild(sub);
  s.appendChild(c);
  var st=el('div','stats');
  st.appendChild(stat('g','+'+lx,'XP earned'));
  st.appendChild(stat('m',Math.round(acc*100)+'%','Accuracy'));
  st.appendChild(stat('c','\u{1F41F} +'+fish,'Fish'));
  st.appendChild(stat('p','x'+lcmb,'Best combo'));
  s.appendChild(st);
  if(gained){
    var cr=el('div','card'); cr.style.textAlign='center';
    cr.innerHTML='<b style="font-family:var(--fd);font-size:21px;color:var(--gold)">\u{1F451} +'+gained+' crown'+(gained>1?'s':'')+'</b>'+
      '<div style="font-size:13px;color:var(--muted)">'+(perfect?'Two crowns for a flawless run':'Replay it perfectly for a second crown')+'</div>';
    s.appendChild(cr);
  }
  var boxKey=rollBox(perfect,wasBoss);
  s.appendChild(boxPanel(boxKey,function(){
    if(streakUp>1)streakModal(streakUp);
    celebrate();
    checkLevelUp();
    var more=checkBadges({});
    var all=newB.concat(more);
    if(all.length)showBadges(all);
    saveNow();
    if(!$('#s-done').hidden){
      var line=$('#s-done .boxdone');
      if(!line){ var d=el('p','boxdone','Box collected. Tap Continue when you are ready.');
        d.style.cssText='text-align:center;color:var(--muted);font-size:13px;margin:10px 0 0'; $('#s-done').appendChild(d) }
    }
  }));
  if(backupDue())s.appendChild(backupNudge());
  L=null; cur=null; phase='answer';
  show('done');
  confetti(perfect?70:38); haptic([14,40,14]);

  var f=$('#foot'); f.hidden=false; var inner=$('#footinner'); inner.innerHTML='';
  var nx=nextTask();
  if(nx&&!wasPractice){
    var go=el('button','btn go','▶ '+(nx.u!==wu?'Next unit':'Next lesson')); go.style.flex='1';
    go.onclick=function(){ SFX.tap(); startLesson(nx.u,nx.l) }; inner.appendChild(go);
  } else {
    var g2=el('button','btn go','Back to the map'); g2.style.flex='1';
    g2.onclick=function(){ SFX.tap(); home() }; inner.appendChild(g2);
  }
  var mb=el('button','btn sm ghost','Map'); mb.onclick=function(){ SFX.tap(); home() }; inner.appendChild(mb);
}

function bumpStreak(){
  var t=today();
  if(S.last===t)return;
  var gap=dayDiff(S.last,t);
  if(!S.last||gap===1)S.streak=(gap===1?S.streak+1:1);
  else if(gap>1){
    if(S.items.freeze>0&&gap===2){ S.items.freeze--; S.streak=S.streak+1; toast('❄️ Streak freeze used') }
    else S.streak=1;
  } else S.streak=Math.max(1,S.streak);
  S.last=t;
  if(S.streak>S.best)S.best=S.streak;
}
function checkBadges(ctx){
  ctx=ctx||{};
  var got=[], t=today();
  function win(id){ if(!S.badges[id]){ S.badges[id]=t; var b=BADGES.filter(function(x){return x.id===id})[0]; if(b)got.push(b) } }
  var units=0; UNITS.forEach(function(U){ if(unitDone(U.n))units++ });
  var perf=0; for(var k in S.lessons){ if(S.lessons[k].c>=2)perf++ }
  if(S.plays>=1)win('first');
  if(ctx.perfect)win('perfect');
  if(perf>=10)win('perfect10');
  if(S.streak>=3)win('streak3');
  if(S.streak>=7)win('streak7');
  if(S.xp>=500)win('xp500');
  if(S.xp>=2000)win('xp2000');
  var wc=wordCount();
  if(wc>=25)win('w25'); if(wc>=100)win('w100'); if(wc>=300)win('w300');
  if((ctx.combo||0)>=10||S.bcombo>=10)win('combo10');
  if((ctx.combo||0)>=25||S.bcombo>=25)win('combo25');
  if(ctx.boss)win('boss');
  if(units>=1)win('unit1'); if(units>=6)win('unit6'); if(units>=12)win('unit12');
  for(var bi=13;bi<=16;bi++){ if(unitDone(bi)){ win('fun'); break } }
  if(S.heard>=50)win('ears'); if(S.typed>=50)win('pen');
  if(S.hat)win('dressed');
  if((S.boxes||0)>=10)win('box10'); if((S.boxes||0)>=50)win('box50');
  if((S.mega||0)>=1)win('mega1');
  if(S.hats.length>=3)win('hats3'); if(S.hats.length>=HATS.length)win('hatsall');
  if(S.streak>=14)win('streak14'); if(S.streak>=30)win('streak30');
  if(S.xp>=5000)win('xp5000');
  if(S.road>=5)win('road5'); if(S.road>=ROAD.length)win('roadend');
  if(S.corr>=500)win('corr500'); if(S.corr>=2000)win('corr2000');
  if((S.bosses||0)>=5)win('boss5'); if((S.said||0)>=25)win('speak25');
  return got;
}

var DL=null,DLtried=false;
function getDL(){
  if(DLtried)return Promise.resolve(DL);
  DLtried=true;
  try{ if(window.claude&&window.claude.use)
    return window.claude.use('downloads').then(function(d){ DL=d; return d },function(){ return null }) }catch(e){}
  return Promise.resolve(null);
}
function backupText(){ return JSON.stringify(S,null,1) }
function backupName(){ return 'sombra-spanish-'+today()+'.json' }
function markBackedUp(){
  S.bk=today(); S.snz=''; saveNow(); SFX.chest(); toast('✓ Backup file saved');
  if(!$('#s-settings').hidden)settings(); else home();
}
function blobDownload(){
  try{
    var blob=new Blob([backupText()],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=backupName(); a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove() },2000);
    return true;
  }catch(e){ return false }
}
function saveBackupFile(btn){
  var old=btn.innerHTML; btn.textContent='Saving…'; btn.disabled=true;
  function finish(ok){
    btn.disabled=false; btn.innerHTML=old;
    if(ok)markBackedUp(); else toast('Could not save a file here — use the code below',1);
  }
  getDL().then(function(d){
    if(d&&d.save){
      d.save({filename:backupName(),data:backupText()}).then(function(){ finish(true) },function(){
        btn.disabled=false; btn.innerHTML=old; toast('Backup cancelled',1) });
      return;
    }
    finish(blobDownload());
  },function(){ finish(blobDownload()) });
}
function encodeState(){ try{ return btoa(unescape(encodeURIComponent(JSON.stringify(S)))) }catch(e){ return '' } }
function parseBackup(str){
  str=String(str||'').trim();
  if(!str)return null;
  var o=null;
  if(str.charAt(0)==='{'){ try{ o=JSON.parse(str) }catch(e){ o=null } }
  if(!o){ try{ o=JSON.parse(decodeURIComponent(escape(atob(str)))) }catch(e){ return null } }
  if(!o||typeof o!=='object'||typeof o.xp!=='number')return null;
  var t=JSON.parse(JSON.stringify(DEF));
  for(var k in DEF){ if(o[k]!=null)t[k]=o[k] }
  if(!Array.isArray(t.hats))t.hats=[];
  return t;
}
function restoreFromFile(){
  var fi=el('input'); fi.type='file'; fi.accept='.json,.txt,application/json,text/plain'; fi.style.display='none';
  fi.onchange=function(){
    var f=fi.files&&fi.files[0]; if(!f){ fi.remove(); return }
    var r=new FileReader();
    r.onload=function(){
      var o=parseBackup(String(r.result)); fi.remove();
      if(!o){ toast('That file is not a Sombra backup',1); return }
      S=o; saveNow(); SFX.chest(); toast('✓ Progress restored'); lastLevel=levelOf(S.xp); home();
    };
    r.onerror=function(){ fi.remove(); toast('Could not read that file',1) };
    r.readAsText(f);
  };
  document.body.appendChild(fi); fi.click();
}

      text:'This wipes what is on this phone and puts the pasted progress in its place.',
      buttons:[
        {label:'Yes, replace it', cls:'bad', fn:function(){ S=o; saveNow(); lastLevel=levelOf(S.xp); toast('Progress loaded'); home() }},
        {label:'Cancel', cls:'ghost', fn:function(){}}]});
  };
  row.appendChild(cp); row.appendChild(ld); c3.appendChild(row);
  s.appendChild(c3);

  s.appendChild(el('div','secttitle','Storage check'));
  var c5=el('div','card');
  function dot(ok){ return ok?'<span style="color:var(--lime)">working</span>':'<span style="color:var(--bad)">not available</span>' }
  c5.innerHTML='<div style="font-size:13px;color:var(--muted);line-height:1.8">'+
    'Loaded from: <b style="color:var(--ink)">'+esc(STORE_FROM)+'</b><br>'+
    'Browser storage: '+dot(HEALTH.local)+'<br>'+
    'Local database: '+dot(HEALTH.idb)+'<br>'+
    'Last saved: <b style="color:var(--ink)">'+(S.ts?new Date(S.ts).toLocaleString():'never')+'</b></div>';
  var tb=el('button','btn sm','Run a save test'); tb.style.marginTop='11px';
  tb.onclick=function(){
    flush();
    setTimeout(function(){
      var okL=false, okI=false;
      try{ okL=!!localStorage.getItem(KEY) }catch(e){}
      idbGet().then(function(v){
        okI=!!v;
        modal({ico:(okL||okI)?'check':'ban', icoCol:(okL||okI)?'var(--lime)':'var(--bad)',
          title:(okL||okI)?'Saving works here':'Saving is blocked here',
          text:(okL||okI)
            ? 'I wrote your progress and read it straight back. Browser storage: '+(okL?'yes':'no')+'. Local database: '+(okI?'yes':'no')+'.'
            : 'This browser refuses to keep anything. Play in Safari or Chrome instead of a private window, and keep a backup file.',
          buttons:[{label:'OK', cls:'go', fn:function(){ settings() }}]});
      });
    },220);
  };
  c5.appendChild(tb);
  s.appendChild(c5);

  s.appendChild(el('div','secttitle','Start over'));
  var c4=el('div','card');
  var rsb=el('button','btn sm bad','Erase all progress');
  rsb.onclick=function(){
    modal({ico:'close', icoCol:'var(--bad)', title:'Erase everything?',
      text:'Every XP, word, badge and crown goes. This cannot be undone.',
      buttons:[
        {label:'Erase it all', cls:'bad', fn:function(){ wipeAll(function(){
          S=JSON.parse(JSON.stringify(DEF)); S.ts=Date.now(); flush(); lastLevel=1; STORE_FROM='a fresh start'; hello() }) }},
        {label:'Keep my progress', cls:'go', fn:function(){}}]});
  };
  c4.appendChild(rsb); s.appendChild(c4);
  show('settings');
}

/* ===================== polish ===================== */
document.addEventListener('pointerdown',function(e){
  if(reduced)return;
  var t=e.target&&e.target.closest?e.target.closest('.btn,.opt,.tile,.hatcard'):null;
  if(!t||t.disabled)return;
  var r=t.getBoundingClientRect();
  var d=el('span','ripple');
  d.style.left=(e.clientX-r.left)+'px';
  d.style.top=(e.clientY-r.top)+'px';
  t.appendChild(d);
  setTimeout(function(){ d.remove() },580);
},true);

setInterval(function(){
  if(reduced||document.visibilityState==='hidden')return;
  if(!$('#modal').hidden)return;
  var cats=document.querySelectorAll('#app .catwrap');
  if(!cats.length)return;
  var c=cats[Math.floor(Math.random()*cats.length)];
  if(c.classList.contains('jump')||c.classList.contains('bonk')||c.classList.contains('spin'))return;
  c.classList.add('wiggle');
  setTimeout(function(){ c.classList.remove('wiggle') },1050);
},8500);

/* ===================== keyboard ===================== */
document.addEventListener('keydown',function(e){
  if(!$('#modal').hidden){ if(e.key==='Escape')closeModal(); return }
  if($('#s-lesson').hidden)return;
  if(e.key==='Enter'){ var b=$('#actbtn'); if(b&&!b.disabled){ e.preventDefault(); b.click() } return }
  if(e.target&&e.target.tagName==='INPUT')return;
  if(/^[1-4]$/.test(e.key)){
    var opts=document.querySelectorAll('#s-lesson .opts .opt');
    var i=parseInt(e.key,10)-1;
    if(opts[i]){ e.preventDefault(); opts[i].click() }
  }
});

/* ===================== boot ===================== */
function adopt(o){
  var t=JSON.parse(JSON.stringify(DEF));
  for(var k in DEF){ if(o[k]!=null){
    if(k==='settings'||k==='items'){ for(var j in DEF[k]) if(o[k][j]!=null)t[k][j]=o[k][j] }
    else t[k]=o[k] } }
  if(!Array.isArray(t.hats))t.hats=[];
  return t;
}
function pickNewest(){
  var cands=[];
  try{ var a=localStorage.getItem(KEY); if(a){ cands.push(['browser storage',a]); HEALTH.local=true } }catch(e){}
  try{ var b=sessionStorage.getItem(KEY); if(b){ cands.push(['this session',b]); HEALTH.session=true } }catch(e){}
  return idbGet().then(function(c){
    if(c)cands.push(['the local database',c]);
    var best=null,bestTs=-1,from='a fresh start';
    cands.forEach(function(pair){
      try{ var o=JSON.parse(pair[1]); var ts=o.ts||0;
        if(ts>=bestTs&&typeof o.xp==='number'){ bestTs=ts; best=o; from=pair[0] } }catch(e){}
    });
    if(best){ S=adopt(best); STORE_FROM=from }
    flush();
  },function(){ flush() });
}
function start(){
  rollDay();
  lastLevel=levelOf(S.xp);
  checkBadges({});
  if(!S.name&&S.plays===0)hello(); else home();
}
function boot(){ pickNewest().then(start,start) }
try{
  if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(function(){boot()});
  else boot();
}catch(e){ boot() }
})();
</script>
